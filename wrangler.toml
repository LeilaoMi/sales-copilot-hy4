# ============================================================
# 销冠助手 · Cloudflare Pages 配置
# ============================================================
#
# 【这个文件什么时候会被读到】
# 只有用命令行 `wrangler pages deploy` 时才会读它。
# 在 Cloudflare 后台点鼠标部署的话，后台那两个框（构建命令 / 输出目录）
# 要自己填成跟这里一样的值 —— 两边不会互相同步，填错了会以后台为准。
#
# 【缓存头不写在这里】
# Pages 不认 wrangler.toml 里的 [[headers]]（那是 Workers / Static Assets 的写法）。
# Pages 的缓存规则写在 **public/_headers** 里，改缓存请去改那个文件。
#
# 【这是纯静态部署，没有后端】
# 项目里没有 functions/ 目录，是有意的。
# 也就是说 Pages 上**不存在 /api/sync 这个接口**，
# 仓库里的 server.js 在这里跑不起来（Pages 不给跑 Node 进程）。
# 所以在 Pages 上使用云同步，必须在应用「设置」里把同步方式选成
# Supabase 那条路，选「自建 / 兼容服务器」一定是连不上的。
# 详细步骤见 DEPLOY.md。
# ============================================================

name = "sales-copilot"

# 部署出去的目录。
#
# 为什么不直接把整个项目目录传上去？
# 因为项目根里躺着 data/ —— 那是真实的客户、商机、跟进记录，
# 带姓名、电话、微信。而 Pages 是静态托管，
# 传上去的每一个文件都是**公开可下载**的：
# 整个目录一传，等于把客户名单挂在 https://xxx.pages.dev/data/ 上任人扒。
#
# 所以固定只传 public/，里面只有站点本身那几个文件。
#
# ⚠️ public/ 里现在只有 _headers，直接部署会是个空站。
#    部署前要先把站点文件拷进去（这一步在 DEPLOY.md 里有原样可抄的命令）：
#      cp index.html styles.css manifest.json *.js *.png public/
pages_build_output_dir = "public"

# Pages 项目照惯例带上，写部署当天就行。
# 它决定 Pages 底层 Worker 运行时的行为版本，跟本站业务逻辑无关。
compatibility_date = "2025-01-01"

# 没有 [vars]、没有 [[kv_namespaces]]、没有 [[dbs]] —— 都不需要。
#
# 尤其是**环境变量**：这个项目的 Supabase 地址和 anon key
# 是在应用「设置」页面里填的，存在浏览器 localStorage，不走构建期注入。
# 所以后台的环境变量一个都不用配，配了也没人读。
# （也正因如此，换浏览器、清缓存之后要重新填一次 —— 见 DEPLOY.md 的注意事项。）
